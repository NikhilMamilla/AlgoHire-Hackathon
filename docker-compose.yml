x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://certiflow:certiflow@postgres:5432/certiflow}
  TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://certiflow:certiflow@postgres:5432/certiflow_test}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-50}
  SLA_MINUTES: ${SLA_MINUTES:-2}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  PORT: 4000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow
      POSTGRES_DB: certiflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1: the init-script temp server listens on the socket only, so this waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U certiflow -d certiflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: certiflow-api
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx tsx src/server.ts"
    environment: *api-env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  worker:
    image: certiflow-api
    command: npx tsx src/worker.ts
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
