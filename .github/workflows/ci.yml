name: ci
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certiflow
          POSTGRES_PASSWORD: certiflow
          POSTGRES_DB: certiflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U certiflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://certiflow:certiflow@localhost:5432/certiflow_test
      TEST_DATABASE_URL: postgresql://certiflow:certiflow@localhost:5432/certiflow_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - name: npm test
        shell: bash # -eo pipefail, so a failing test still fails the step through tee
        run: |
          npm test 2>&1 | tee test.log
          echo "::notice title=vitest::$(sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E '^ *(Test Files|Tests) ' | tr -s ' ' | paste -sd ' ')"
      - name: curl walkthrough (DRAFT -> APPROVED -> ISSUED -> revoke)
        shell: bash
        working-directory: apps/api
        run: |
          npx tsx src/server.ts > server.log 2>&1 &
          npx tsx src/worker.ts > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/api/health >/dev/null && break; sleep 1; done
          ../../scripts/walkthrough.sh http://localhost:4000 | tee walk.log
          echo "::notice title=walkthrough::$(paste -sd '|' walk.log)"
          echo "::notice title=worker::$(grep -c '"worker started"' worker.log) workers started; $(grep -c 'job failed' worker.log) failed job attempts (flaky provider)"
      - name: server/worker logs on failure
        if: failure()
        working-directory: apps/api
        run: tail -n 60 server.log worker.log || true
      - run: npm run build -w apps/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
